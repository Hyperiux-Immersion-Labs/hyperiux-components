name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter hyperiux lint

      - name: Test
        run: pnpm --filter hyperiux test

      - name: Build (syntax check + smoke)
        run: pnpm --filter hyperiux build

      - name: Smoke — bin entrypoint
        run: pnpm --filter hyperiux smoke:bin

      - name: Pack dry-run
        run: cd packages/cli && npm pack --dry-run
