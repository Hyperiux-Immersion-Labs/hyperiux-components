name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          pnpm lint
          pnpm --filter hyperiux test

      - name: Publish CLI with provenance
        # Plain npm publish, not pnpm publish - pnpm's OIDC trusted-publishing
        # support is currently broken on GitHub Actions (pnpm/pnpm#11513),
        # while npm CLI's is GA. Upgrading npm first guarantees the >=11.5.1
        # CLI version trusted publishing requires, regardless of whatever
        # version happens to ship with the pinned Node version. NODE_AUTH_TOKEN
        # stays wired as a fallback in case OIDC isn't picked up for any reason.
        run: |
          npm install -g npm@latest
          cd packages/cli
          PKG_VERSION=$(node -p "require('./package.json').version")
          # npm refuses to publish a prerelease (e.g. 1.1.0-beta.1) without an
          # explicit --tag - it won't guess and risk landing it on "latest".
          # Derive the dist-tag from the prerelease identifier itself (beta,
          # rc, etc.); a plain version (no hyphen) falls through to "latest".
          NPM_TAG=$(echo "$PKG_VERSION" | sed -n 's/^[^-]*-\([a-zA-Z]*\).*/\1/p')
          NPM_TAG=${NPM_TAG:-latest}
          if npm view "hyperiux@$PKG_VERSION" version &>/dev/null; then
            echo "hyperiux@$PKG_VERSION is already published, skipping."
          else
            npm publish --provenance --access public --tag "$NPM_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run quality gates (MCP server)
        run: |
          pnpm --filter hyperiux-mcp-server lint
          pnpm --filter hyperiux-mcp-server test

      - name: Build MCP server
        run: pnpm --filter hyperiux-mcp-server build

      - name: Publish MCP server with provenance
        # Same reasoning as the CLI publish step above - npm CLI's OIDC
        # trusted publishing, NODE_AUTH_TOKEN as fallback. This is this
        # package's first-ever publish, so trusted publishing likely isn't
        # configured yet on npmjs.com (it can usually only be set up for a
        # package that already exists) - NODE_AUTH_TOKEN doing the real work
        # for this first release is expected, not a sign something's wrong.
        run: |
          cd packages/mcp-server
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_TAG=$(echo "$PKG_VERSION" | sed -n 's/^[^-]*-\([a-zA-Z]*\).*/\1/p')
          NPM_TAG=${NPM_TAG:-latest}
          if npm view "hyperiux-mcp-server@$PKG_VERSION" version &>/dev/null; then
            echo "hyperiux-mcp-server@$PKG_VERSION is already published, skipping."
          else
            npm publish --provenance --access public --tag "$NPM_TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --latest
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --latest
          fi
