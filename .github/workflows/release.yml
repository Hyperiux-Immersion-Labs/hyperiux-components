name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          pnpm lint
          pnpm --filter hyperiux test

      - name: Publish with provenance
        # Plain npm publish, not pnpm publish - pnpm's OIDC trusted-publishing
        # support is currently broken on GitHub Actions (pnpm/pnpm#11513),
        # while npm CLI's is GA. Upgrading npm first guarantees the >=11.5.1
        # CLI version trusted publishing requires, regardless of whatever
        # version happens to ship with the pinned Node version. NODE_AUTH_TOKEN
        # stays wired as a fallback in case OIDC isn't picked up for any reason.
        run: |
          npm install -g npm@latest
          cd packages/cli
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --latest
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --latest
          fi
